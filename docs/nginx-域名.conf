proxy_cache_path /www/wwwroot/1.117.230.95/proxy_cache_dir levels=1:2 keys_zone=1_117_230_95_cache:20m inactive=1d max_size=5g;

server {
    listen 80;
    listen [::]:80;
    server_name 1.117.230.95;

    # 一键申请SSL证书验证目录（暂时没有证书，保留也无害）
    location /.well-known {
        allow all;
    }

    client_max_body_size 16m;

    # Gzip：主包 JS/CSS 再压一半
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 前端静态文件（dist 上传到该目录）
    root /www/wwwroot/1.117.230.95/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口文件禁止缓存（保证发版后立即生效）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带哈希的静态资源，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 下载接口：会员单次最长 30 分钟，超时放宽到 1900s，关闭缓冲
    location /api/download {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 1900s;
        proxy_buffering off;
    }

    # 后端 API 代理：关闭缓冲让 SSE 流式（总结/问答/导图）逐字输出
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # 禁止访问的敏感文件
    location ~* (\.user\.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$ {
        return 404;
    }

    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    access_log /www/wwwlogs/1.117.230.95.log;
    error_log  /www/wwwlogs/1.117.230.95.error.log;
}
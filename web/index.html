      <h1>随下（万能视频下载总结器）：在线视频下载与 AI 总结</h1>

      </p>

      <h2>核心功能</h2>
      <ul>
        <li>解析公开视频链接，收拢为最多四档清晰度：最佳 1080p、最佳 720p、最佳 480p、仅音频。</li>

        <li>基于公开字幕生成中文大纲、要点和带时间点的章节，支持 Markdown 排版与复制。</li>
        <li>字幕提取与导出，支持纯文本 TXT、时间戳 TXT、标准 SRT、Web 播放器 VTT 四种格式。</li>
        <li>把视频结构画成思维导图，普通视图与全屏都可查看，支持导出 2x/3x PNG 与矢量 SVG。</li>
        <li>基于字幕或粘贴资料做多轮问答，回答引用字幕时带时间点。</li>
        <li>下载、总结、字幕、导图、问答共用同一条链接，切换标签不丢失已有结果。</li>
      </ul>

      <h2>支持平台</h2>
      <p>Bilibili、YouTube、抖音。其它平台通过 yt-dlp 尝试解析，成功率取决于上游支持进度。</p>

      <h2>使用场景</h2>
      <ul>
        <li>网课与公开课：先看总结决定是否完整观看，再导出字幕做笔记。</li>

        <li>内容整理：把视频结构导出成导图，放进汇报或文档。</li>
        <li>字幕复用：导出 SRT 给剪辑软件，或导出纯文本做文字稿。</li>
      </ul>

      <h2>使用边界</h2>
      <ul>
        <li>只支持公开链接，不支持付费内容、私密视频或需要登录才能观看的内容。</li>
